global:
  environment: staging
  namespace: cloudmart-staging

cloudConfig:
  awsRegion: "ap-south-1"
  dynamoDbTable: "cloudmart-products-staging"
  sqsQueueUrl: "https://sqs.ap-south-1.amazonaws.com/779417963796/cloudmart-order-events-staging"
  fromEmail: "noreply@cloudmart.example"
  dbHost: "cloudmart-postgres-staging.xxxxxxxx.ap-south-1.rds.amazonaws.com"
  dbPort: "5432"
  dbName: "cloudmart"

externalSecrets:
  enabled: true
  secretStore:
    roleArn: "arn:aws:iam::779417963796:role/cloudmart-user-service-role-staging"
  dbSecretArn: "arn:aws:secretsmanager:ap-south-1:779417963796:secret:cloudmart-db-credentials-staging"
  jwtSecretArn: "arn:aws:secretsmanager:ap-south-1:779417963796:secret:cloudmart-jwt-secret-staging"

frontend:
  image:
    repository: "cloudmart-frontend-staging"

product:
  image:
    repository: "cloudmart-product-service-staging"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-product-service-role-staging"

order:
  image:
    repository: "cloudmart-order-service-staging"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-order-service-role-staging"

user:
  image:
    repository: "cloudmart-user-service-staging"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-user-service-role-staging"

notification:
  image:
    repository: "cloudmart-notification-service-staging"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-notification-service-role-staging"
