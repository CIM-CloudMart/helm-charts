{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.cloudConfig.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.user.serviceAccount.name | default "user-service-sa" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudmart-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: cloudmart-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.externalSecrets.dbSecretArn }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.dbSecretArn }}
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.jwtSecretArn }}
{{- end -}}
