global:
  environment: production
  namespace: cloudmart-prod

cloudConfig:
  awsRegion: "ap-south-1"
  dynamoDbTable: "cloudmart-products-prod"
  sqsQueueUrl: "https://sqs.ap-south-1.amazonaws.com/779417963796/cloudmart-order-events-prod"
  fromEmail: "noreply@cloudmart.example"
  dbHost: "cloudmart-postgres-prod.xxxxxxxx.ap-south-1.rds.amazonaws.com"
  dbPort: "5432"
  dbName: "cloudmart"

externalSecrets:
  enabled: true
  secretStore:
    roleArn: "arn:aws:iam::779417963796:role/cloudmart-user-service-role-prod"
  dbSecretArn: "arn:aws:secretsmanager:ap-south-1:779417963796:secret:cloudmart-db-credentials-prod"
  jwtSecretArn: "arn:aws:secretsmanager:ap-south-1:779417963796:secret:cloudmart-jwt-secret-prod"

frontend:
  image:
    repository: "cloudmart-frontend-prod"

product:
  image:
    repository: "cloudmart-product-service-prod"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-product-service-role-prod"

order:
  image:
    repository: "cloudmart-order-service-prod"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-order-service-role-prod"

user:
  image:
    repository: "cloudmart-user-service-prod"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-user-service-role-prod"

notification:
  image:
    repository: "cloudmart-notification-service-prod"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::779417963796:role/cloudmart-notification-service-role-prod"
