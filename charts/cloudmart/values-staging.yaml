namespace: cloudmart-staging
global:
  environment: staging
  namespace: cloudmart-staging
  awsAccountId: "427712745475"
  registry: "427712745475.dkr.ecr.ap-south-1.amazonaws.com"
  xray:
    enabled: true
cloudConfig:
  awsRegion: "ap-south-1"
  dynamoDbTable: "cloudmart-products-staging"
  sqsQueueUrl: "https://sqs.ap-south-1.amazonaws.com/427712745475/cloudmart-order-events-staging"
  fromEmail: "noreply@cloudmart.example"
  dbHost: "cloudmart-postgres-staging.cjw4kaiiw5dg.ap-south-1.rds.amazonaws.com"
  dbPort: "5432"
  dbName: "cloudmart"
externalSecrets:
  enabled: true
  secretStore:
    roleArn: ""
  dbSecretArn: "arn:aws:secretsmanager:ap-south-1:427712745475:secret:cloudmart-db-credentials-staging-SvnViN"
  jwtSecretArn: "arn:aws:secretsmanager:ap-south-1:427712745475:secret:cloudmart-jwt-secret-staging-atthMP"
frontend:
  namespace: cloudmart-staging
  replicaCount: 1
  image:
    repository: "cloudmart-frontend-staging"
    tag: "91396f1129a90955a2f53dfd77ecf976bb02ce67"
  ingress:
    enabled: true
    className: "alb"
    annotations:
      alb.ingress.kubernetes.io/scheme: "internet-facing"
      alb.ingress.kubernetes.io/target-type: "ip"
      alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:ap-south-1:427712745475:regional/webacl/cloudmart-waf-web-acl-staging/3e4cd9da-efae-4f08-9214-1bf73cea9a51"
    hosts:
      - host: ""
        paths:
          - path: "/"
            pathType: "Prefix"
          - path: "/api/products"
            pathType: "Prefix"
            backendService: "product-service-stable"
            backendPort: 8001
          - path: "/api/categories"
            pathType: "Prefix"
            backendService: "product-service-stable"
            backendPort: 8001
          - path: "/api/trigger-error"
            pathType: "Prefix"
            backendService: "product-service-stable"
            backendPort: 8001
product:
  namespace: cloudmart-staging
  replicaCount: 1
  argoRollouts:
    enabled: true
  canary:
    enabled: false
  image:
    repository: "cloudmart-product-service-staging"
    tag: "91396f1129a90955a2f53dfd77ecf976bb02ce67"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::427712745475:role/cloudmart-product-service-role-staging"
order:
  namespace: cloudmart-staging
  replicaCount: 1
  image:
    repository: "cloudmart-order-service-staging"
    tag: "91396f1129a90955a2f53dfd77ecf976bb02ce67"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::427712745475:role/cloudmart-order-service-role-staging"
user:
  namespace: cloudmart-staging
  replicaCount: 1
  image:
    repository: "cloudmart-user-service-staging"
    tag: "91396f1129a90955a2f53dfd77ecf976bb02ce67"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::427712745475:role/cloudmart-user-service-role-staging"
notification:
  namespace: cloudmart-staging
  replicaCount: 1
  image:
    repository: "cloudmart-notification-service-staging"
    tag: "91396f1129a90955a2f53dfd77ecf976bb02ce67"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::427712745475:role/cloudmart-notification-service-role-staging"
  cloudConfig:
    awsRegion: "ap-south-1"
    sqsQueueUrl: "https://sqs.ap-south-1.amazonaws.com/427712745475/cloudmart-order-events-staging"

# Network Security Policies configuration
networkPolicy:
  enabled: true
  # ALB Subnets CIDRs for restricting Ingress traffic to the frontend.
  # Defaults to the public subnets of the VPC.
  albSubnets:
    - 10.0.0.0/20
    - 10.0.16.0/20

  # Egress destination CIDRs for each service
  product:
    # Product service accesses DynamoDB.
    # We default to the VPC CIDR and specific AWS DynamoDB IP ranges in ap-south-1.
    dynamodbEndpoints:
      - 10.0.0.0/16
      - 52.94.0.0/15
      - 52.119.224.0/20
  
  order:
    # Order service accesses SQS and Product service.
    # SQS endpoint CIDR. If using SQS Interface VPC Endpoint, it resides in the private app subnets.
    sqsEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20

  notification:
    # Notification service accesses SQS and SES.
    # If using Interface VPC Endpoints, they reside in private app subnets.
    sqsEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20
    sesEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20

  user:
    # User service accesses RDS PostgreSQL and Secrets Manager.
    # RDS database resides in the private data subnets.
    rdsEndpoints:
      - 10.0.64.0/20
      - 10.0.80.0/20
    # Secrets Manager Interface VPC Endpoint resides in private app subnets.
    secretsManagerEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20

