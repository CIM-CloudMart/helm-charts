{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "user.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-jwt-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user.labels" . | nindent 4 }}
  {{- if .Values.jwtServiceAccount }}
  {{- with .Values.jwtServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end -}}
