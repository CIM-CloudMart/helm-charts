apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "user.fullname" . }}-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "user.selectorLabels" . | nindent 6 }}
