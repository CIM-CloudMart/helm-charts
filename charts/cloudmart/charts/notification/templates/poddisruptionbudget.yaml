apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "notification.fullname" . }}-pdb
  namespace: {{ .Values.namespace | default "cloudmart-prod" }}
  labels:
    {{- include "notification.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "notification.selectorLabels" . | nindent 6 }}
