replicaCount: 1
image:
  repository: "product-service"
  tag: "latest"
  pullPolicy: "IfNotPresent"
resources:
  requests:
    cpu: "20m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"
service:
  type: "ClusterIP"
  port: 8001
serviceAccount:
  create: true
  annotations: {}
  name: "product-service-sa"
