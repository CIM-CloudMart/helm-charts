{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "product.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "product.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "product.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "product.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "product.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ if .Values.global.registry }}{{ .Values.global.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STORE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: PRODUCT_STORE_BACKEND
            - name: DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DYNAMODB_TABLE
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: AWS_REGION
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
  strategy:
    canary:
      analysis:
        templates:
          - templateName: {{ include "product.fullname" . }}-error-rate
        args:
          - name: service-name
            value: {{ include "product.fullname" . }}
      steps:
        - setWeight: 10
        - pause: { duration: 1m }
        - setWeight: 30
        - pause: { duration: 1m }
        - setWeight: 50
        - pause: { duration: 1m }
{{- end }}
