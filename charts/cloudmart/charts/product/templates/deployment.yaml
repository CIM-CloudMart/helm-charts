apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "product.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "product.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  minReadySeconds: 5
  selector:
    matchLabels:
      {{- include "product.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "product.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "product.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ if .Values.global.registry }}{{ .Values.global.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STORE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: PRODUCT_STORE_BACKEND
            - name: DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DYNAMODB_TABLE
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: AWS_REGION
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: AWS_REGION
            {{- if .Values.global.xray.enabled }}
            - name: AWS_XRAY_TRACING_NAME
              value: "product-service"
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
        {{- if .Values.global.xray.enabled }}
        - name: xray-daemon
          image: amazon/aws-xray-daemon:3.x
          ports:
            - name: xray-ingest
              containerPort: 2000
              protocol: UDP
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        {{- end }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
