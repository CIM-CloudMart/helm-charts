namespace: "cloudmart-prod"
global:
  project: "cloudmart"
  awsAccountId: "427712745475"
  # Registry URI to prepend to all images (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com)
  registry: "427712745475.dkr.ecr.ap-south-1.amazonaws.com"
  environment: prod
  namespace: cloudmart-prod
  xray:
    enabled: false

# Secrets Store CSI configuration
secretsStoreCSI:
  enabled: false



# Shared Configuration settings for the microservices
config:
  productStoreBackend: "dynamodb"
  orderQueueBackend: "sqs"       
  notificationQueueBackend: "sqs"
  notificationEmailBackend: "ses"  
  notificationPollInterval: "5000"  
  userDbBackend: "postgres"

# Cloud configuration (populated dynamically or via env-specific values)
cloudConfig:
  awsRegion: "ap-south-1"
  dynamoDbTable: "cloudmart-products-prod"
  sqsQueueUrl: "https://sqs.ap-south-1.amazonaws.com/427712745475/cloudmart-order-events-prod"
  fromEmail: "tradeasy.official01@gmail.com"
  dbHost: "cloudmart-postgres-prod.xxxxxxxx.ap-south-1.rds.amazonaws.com"
  dbPort: "5432"
  dbName: "cloudmart"

# External Secrets Operator configuration
externalSecrets:
  enabled: true
  secretStore:
    roleArn: ""
  dbSecretArn: ""
  jwtSecretArn: ""

# Subchart: frontend
frontend:
  namespace: "cloudmart-prod"
  fullnameOverride: "frontend"
  replicaCount: 1
  image:
    repository: "cloudmart-frontend-prod"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "32Mi"
  service:
    type: "ClusterIP"
    port: 80
  ingress:
    enabled: false
    className: "alb"
    annotations:
      alb.ingress.kubernetes.io/scheme: "internet-facing"
      alb.ingress.kubernetes.io/target-type: "ip"
    hosts:
      - host: "cloudmart.example.com"
        paths:
          - path: "/"
            pathType: "Prefix"
          - path: "/api/products"
            pathType: "Prefix"
            backendService: "product-service-stable"
            backendPort: 8001
          - path: "/api/categories"
            pathType: "Prefix"
            backendService: "product-service-stable"
            backendPort: 8001
          - path: "/api/trigger-error"
            pathType: "Prefix"
            backendService: "product-service-stable"
            backendPort: 8001

# Subchart: product
product:
  namespace: "cloudmart-prod"
  fullnameOverride: "product-service"
  replicaCount: 1
  argoRollouts:
    enabled: true
  canary:
    enabled: false
  image:
    repository: "cloudmart-product-service-prod"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "20m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  service:
    type: "ClusterIP"
    port: 8001
  serviceAccount:
    create: true
    annotations: {}
    name: "product-service-sa"

# Subchart: order
order:
  namespace: "cloudmart-prod"
  fullnameOverride: "order-service"
  replicaCount: 1
  image:
    repository: "cloudmart-order-service-prod"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  service:
    type: "ClusterIP"
    port: 8002
  serviceAccount:
    create: true
    annotations: {}
    name: "order-service-sa"

# Subchart: user
user:
  namespace: "cloudmart-prod"
  fullnameOverride: "user-service"
  replicaCount: 1
  image:
    repository: "cloudmart-user-service-prod"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  service:
    type: "ClusterIP"
    port: 8003
  serviceAccount:
    create: true
    annotations: {}
    name: "user-service-sa"
  jwtServiceAccount:
    annotations: {}

# Subchart: notification
notification:
  namespace: "cloudmart-prod"
  fullnameOverride: "notification-service"
  replicaCount: 1
  image:
    repository: "cloudmart-notification-service-prod"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  cloudConfig:
    awsRegion: "ap-south-1"
    sqsQueueUrl: "https://sqs.ap-south-1.amazonaws.com/427712745475/cloudmart-order-events-prod"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
  service:
    type: "ClusterIP"
    port: 8004
  serviceAccount:
    create: true
    annotations: {}
    name: "notification-service-sa"

# Policy Engine (Kyverno) configurations
kyverno:
  enabled: true

# Network Security Policies configuration
networkPolicy:
  enabled: true
  # ALB Subnets CIDRs for restricting Ingress traffic to the frontend.
  # Defaults to the public subnets of the VPC.
  albSubnets:
    - 10.0.0.0/20
    - 10.0.16.0/20

  # Egress destination CIDRs for each service
  product:
    # Product service accesses DynamoDB.
    # We default to the VPC CIDR and specific AWS DynamoDB IP ranges in ap-south-1.
    dynamodbEndpoints:
      - 10.0.0.0/16
      - 52.94.0.0/15
      - 52.119.224.0/20
  
  order:
    # Order service accesses SQS and Product service.
    # SQS endpoint CIDR. If using SQS Interface VPC Endpoint, it resides in the private app subnets.
    sqsEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20

  notification:
    # Notification service accesses SQS and SES.
    # If using Interface VPC Endpoints, they reside in private app subnets.
    sqsEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20
    sesEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20

  user:
    # User service accesses RDS PostgreSQL and Secrets Manager.
    # RDS database resides in the private data subnets.
    rdsEndpoints:
      - 10.0.64.0/20
      - 10.0.80.0/20
    # Secrets Manager Interface VPC Endpoint resides in private app subnets.
    secretsManagerEndpoints:
      - 10.0.32.0/20
      - 10.0.48.0/20

fargateLogging:
  enabled: false

