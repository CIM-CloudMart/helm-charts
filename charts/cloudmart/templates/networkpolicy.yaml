# ==================== Network Policies ====================
# Restricts traffic using the principle of least privilege.
# Note: Denying all egress requires explicitly allowing DNS resolution.

# 1. Default-deny Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # Explicitly allow egress to kube-system CoreDNS pods for DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Frontend Network Policy

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
      helm.sh/chart: {{ printf "frontend-%s" .Chart.Version }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow external web traffic only via ALB subnets
    - from:
        {{- range .Values.networkPolicy.albSubnets }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow connection to backend APIs
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "product-%s" .Chart.Version }}
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "order-%s" .Chart.Version }}
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "user-%s" .Chart.Version }}
      ports:
        - protocol: TCP
          port: 8003
---
# 4. Product Service Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-service-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product
      app.kubernetes.io/instance: {{ .Release.Name }}
      helm.sh/chart: {{ printf "product-%s" .Chart.Version }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Frontend proxy and Order Service (stock check)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "frontend-%s" .Chart.Version }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "order-%s" .Chart.Version }}
      ports:
        - protocol: TCP
          port: 8001
  egress:
    # Allow egress to DynamoDB endpoint only
    - to:
        {{- range .Values.networkPolicy.product.dynamodbEndpoints }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
---
# 5. Order Service Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order
      app.kubernetes.io/instance: {{ .Release.Name }}
      helm.sh/chart: {{ printf "order-%s" .Chart.Version }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Frontend proxy
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "frontend-%s" .Chart.Version }}
      ports:
        - protocol: TCP
          port: 8002
  egress:
    # Allow stock verification calls to Product Service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "product-%s" .Chart.Version }}
      ports:
        - protocol: TCP
          port: 8001
    # Allow connection to SQS endpoint only
    - to:
        {{- range .Values.networkPolicy.order.sqsEndpoints }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
---
# 6. User Service Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: user
      app.kubernetes.io/instance: {{ .Release.Name }}
      helm.sh/chart: {{ printf "user-%s" .Chart.Version }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Frontend proxy
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
              app.kubernetes.io/instance: {{ .Release.Name }}
              helm.sh/chart: {{ printf "frontend-%s" .Chart.Version }}
      ports:
        - protocol: TCP
          port: 8003
  egress:
    # Allow egress to RDS PostgreSQL database only
    - to:
        {{- range .Values.networkPolicy.user.rdsEndpoints }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Secrets Manager only
    - to:
        {{- range .Values.networkPolicy.user.secretsManagerEndpoints }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
---
# 7. Notification Service Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification
      app.kubernetes.io/instance: {{ .Release.Name }}
      helm.sh/chart: {{ printf "notification-%s" .Chart.Version }}
  policyTypes:
    - Ingress
    - Egress
  ingress: [] # No ingress traffic allowed to this asynchronous worker
  egress:
    # Allow connection to SQS queue only to read notifications
    - to:
        {{- range .Values.networkPolicy.notification.sqsEndpoints }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    # Allow connection to SES only to send emails
    - to:
        {{- range .Values.networkPolicy.notification.sesEndpoints }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443

