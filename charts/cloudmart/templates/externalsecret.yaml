{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-aws-db-secretsmanager-store
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.cloudConfig.awsRegion }}
      {{- if .Values.externalSecrets.secretStore.roleArn }}
      role: {{ .Values.externalSecrets.secretStore.roleArn }}
      {{- end }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.user.serviceAccount.name | default "user-service-sa" }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-aws-jwt-secretsmanager-store
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.cloudConfig.awsRegion }}
      {{- if .Values.externalSecrets.secretStore.roleArn }}
      role: {{ .Values.externalSecrets.secretStore.roleArn }}
      {{- end }}
      auth:
        jwt:
          serviceAccountRef:
            name: user-jwt-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Release.Name }}-aws-db-secretsmanager-store
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-db-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.externalSecrets.dbSecretArn | default (printf "%s-db-credentials-%s" (default "cloudmart" .Values.global.project) .Values.global.environment) }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.dbSecretArn | default (printf "%s-db-credentials-%s" (default "cloudmart" .Values.global.project) .Values.global.environment) }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-jwt-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Release.Name }}-aws-jwt-secretsmanager-store
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-jwt-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.jwtSecretArn | default (printf "%s-jwt-secret-%s" (default "cloudmart" .Values.global.project) .Values.global.environment) }}
{{- end -}}
