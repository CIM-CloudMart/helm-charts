{{- if not .Values.externalSecrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  DB_USER: {{ "postgres" | b64enc | quote }}
  DB_PASSWORD: {{ "postgres" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-jwt-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  JWT_SECRET: {{ "local-dev-fallback-jwt-secret-key-32-chars-long" | b64enc | quote }}
{{- end -}}
