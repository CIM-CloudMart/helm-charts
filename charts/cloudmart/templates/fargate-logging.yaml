{{- if .Values.fargateLogging.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: aws-observability
  labels:
    aws-observability: "enabled"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  flb_log_cw: "true"
  
  filters.conf: |
    [FILTER]
        Name parser
        Match *
        Key_Name log
        Parser crio
        Reserve_Key On
        
  output.conf: |
    [OUTPUT]
        Name cloudwatch_logs
        Match *
        region {{ .Values.cloudConfig.awsRegion }}
        log_group_name /cloudmart/fargate-logs
        log_stream_prefix fargate-
        auto_create_group true
        
  parsers.conf: |
    [PARSER]
        Name crio
        Format Regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
{{- end }}
